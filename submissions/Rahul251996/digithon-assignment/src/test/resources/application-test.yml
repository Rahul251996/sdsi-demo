spring:
  datasource:
    username: test
    password: test
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

reservation:
  default-ttl-seconds: 120
  max-ttl-seconds: 3600
  max-quantity-per-reservation: 100
  expiry-cleanup:
    enabled: false
    batch-size: 100
    fixed-delay-ms: 30000
    initial-delay-ms: 15000

inventory:
  seed:
    enabled: false
  seed-file: classpath:test-inventory.json

logging:
  level:
    root: WARN
    com.digithon.assignment: INFO