spring:
  application:
    name: inventory-reservation

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inventory_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:inventory_app}
    password: ${DB_PASSWORD:change_me_locally}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

reservation:
  default-ttl-seconds: 120
  max-ttl-seconds: 3600
  max-quantity-per-reservation: 100
  max-active-reservations-per-user: 5
  max-total-reserved-quantity-per-user: 50
  cooldown-seconds-after-cancel: 60
  expiry-cleanup:
    enabled: true
    batch-size: 100
    fixed-delay-ms: 30000
    initial-delay-ms: 15000

inventory:
  seed-file: classpath:inventory.json

logging:
  level:
    root: INFO
    com.digithon.assignment: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"